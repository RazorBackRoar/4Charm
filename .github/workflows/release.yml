name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  UV_FIND_LINKS: ci/vendor
  UV_NO_SOURCES_PACKAGE: razorcore

jobs:
  macos-dmg:
    name: Build macOS DMG
    runs-on: macos-15
    steps:
      - name: Checkout 4Charm
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Sync
        run: uv sync --all-extras --dev

      - name: Package app and DMG
        run: bash scripts/package-macos.sh

      - name: Zip .app for GitHub Release
        run: ditto -c -k --keepParent dist/4Charm.app dist/4Charm.app.zip

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 4Charm-macos
          path: |
            dist/4Charm.dmg
            dist/4Charm.dmg.sha256
            dist/4Charm.app.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          tag="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            tag="v${version}"
          fi
          notes="$(mktemp)"
          {
            echo "Native macOS 4chan media downloader. Drag-and-drop DMG installer."
            echo
            echo "## Install"
            echo "Open \`4Charm.dmg\`, drag **4Charm** into Applications, then eject the disk image."
            echo
            echo "A zipped \`4Charm.app\` is also attached if you prefer not to use the disk image."
            echo
            echo "## What’s new"
            echo "- Oversized files already on disk are quarantined before re-download and restored if replacement fails"
            echo "- Architecture guide and expanded download-pipeline tests"
            echo
            echo "## SHA-256"
            echo "\`4Charm.dmg\`"
            echo "\`$(awk '{print $1}' dist/4Charm.dmg.sha256)\`"
          } > "${notes}"

          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release upload "${tag}" dist/4Charm.dmg dist/4Charm.dmg.sha256 dist/4Charm.app.zip --clobber
            gh release edit "${tag}" --title "4Charm ${version}" --notes-file "${notes}"
          else
            gh release create "${tag}" \
              dist/4Charm.dmg \
              dist/4Charm.dmg.sha256 \
              dist/4Charm.app.zip \
              --title "4Charm ${version}" \
              --notes-file "${notes}" \
              --target "${GITHUB_SHA}"
          fi
